name: keep-render-awake

# Mantiene despierto el servicio de Render (plan Free) haciéndole ping cada ~10 min.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping al servicio
        run: |
          URL="https://cotizaciones-t7k6.onrender.com"
          echo "Ping a $URL"
          curl -sS -o /dev/null -w "Respuesta: HTTP %{http_code}\n" --max-time 90 "$URL" || echo "Ping fallido (el servicio pudo estar despertando)."
